[project]
name = "glocal-agent"
version = "0.1.0"
description = "Local file pilot for Glocal's AI-native office agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
glocal-agent = "glocal_agent.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.56,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glocal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
