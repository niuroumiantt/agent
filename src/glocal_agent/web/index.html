<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="agent-session" content="__SESSION_TOKEN__">
  <meta name="color-scheme" content="light">
  <title>Glocal Agent · 对话工作台</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-arrow-out" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m8 13 7-7a3 3 0 0 1 4 4l-9 9a5 5 0 0 1-7-7l9-9m-6 12 9-9"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 9h18"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/><path d="M6 9h1M6 13h1M17 9h1M17 13h1"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9H13a8.5 8.5 0 0 1 8 8z"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M10 11H4V5h6v6c0 4-2 6-5 7M20 11h-6V5h6v6c0 4-2 6-5 7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4zM20 2v4M18 4h4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M9 12h12m-4-4 4 4-4 4"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="文件与对话">
      <header class="sidebar-header">
        <span class="brand-mark" aria-hidden="true">g</span><strong>Glocal Agent</strong>
        <button id="close-sidebar" class="icon-button mobile-only" aria-label="关闭侧栏" type="button"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <button id="new-chat" class="new-chat" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>新对话<kbd>⌘ K</kbd></button>
      <section class="sidebar-section files-section" aria-labelledby="files-heading">
        <div class="section-heading"><h2 id="files-heading">我的文件</h2><label class="select-all-label"><input id="select-all" type="checkbox">全选</label></div>
        <div class="file-list" id="file-list"><p class="sidebar-empty">正在读取文件…</p></div>
      </section>
      <section class="sidebar-section conversations-section" aria-labelledby="conversations-heading">
        <div class="section-heading"><h2 id="conversations-heading">最近对话</h2></div>
        <div id="conversation-list" class="conversation-list"></div>
      </section>
      <details class="legacy-tasks" id="legacy-tasks"><summary><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>此前的任务<span id="job-count">0</span><svg class="icon detail-chevron" aria-hidden="true"><use href="#i-chevron"/></svg></summary><div id="job-list"></div></details>
      <footer class="sidebar-footer">
        <div class="model-status"><span id="model-dot" class="status-dot"></span><span id="model-name">正在读取模型…</span></div>
        <nav id="office-apps" class="hidden" aria-label="公司应用"><a href="https://oa.glocalstorage.cn/"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>OA</a><a href="https://mail.glocalstorage.cn/"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Mail</a><a href="/oauth2/sign_out"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>退出</a></nav>
      </footer>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-label="关闭侧栏" type="button"></button>
    <main class="chat-workspace" id="chat-workspace">
      <header class="chat-header">
        <button id="open-sidebar" class="icon-button mobile-only" aria-label="打开文件与对话" aria-expanded="false" aria-controls="sidebar" type="button"><svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg></button>
        <div class="chat-heading"><span class="header-label">工作空间</span><h1 id="chat-title">新对话</h1></div>
        <span class="workspace-tag"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>个人空间</span>
      </header>
      <div class="thread" id="thread" tabindex="0" aria-label="对话内容">
        <section class="welcome" id="welcome">
          <span class="welcome-mark" aria-hidden="true"><svg class="icon"><use href="#i-sparkle"/></svg></span>
          <p class="welcome-eyebrow">Glocal Agent</p><h2>今天，想一起完成什么？</h2>
          <p>选几份资料，或者直接聊聊。<br>我们从你的想法开始。</p>
          <div class="suggestions">
            <button data-message="总结选中的文件，并引用原文。" type="button"><span class="suggestion-icon"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg></span><span class="suggestion-copy"><strong>整理材料</strong><small>提炼要点，保留引用</small></span><svg class="icon suggestion-arrow" aria-hidden="true"><use href="#i-arrow-out"/></svg></button>
            <button data-message="比较选中的文件，指出差异和需要跟进的问题。" type="button"><span class="suggestion-icon violet"><svg class="icon" aria-hidden="true"><use href="#i-compare"/></svg></span><span class="suggestion-copy"><strong>比较核对</strong><small>找出差异与待办</small></span><svg class="icon suggestion-arrow" aria-hidden="true"><use href="#i-arrow-out"/></svg></button>
            <button data-message="查看文件列表" type="button"><span class="suggestion-icon blue"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg></span><span class="suggestion-copy"><strong>查看文件</strong><small>从已有资料开始</small></span><svg class="icon suggestion-arrow" aria-hidden="true"><use href="#i-arrow-out"/></svg></button>
          </div>
        </section>
      </div>
      <div class="composer-area">
        <div id="notice" class="notice hidden" role="status"></div>
        <div class="composer" id="composer">
          <div id="attachments" class="attachments" aria-label="本条消息的文件"></div>
          <label class="sr-only" for="message-input">发送给 Agent 的消息</label>
          <textarea id="message-input" rows="2" maxlength="2000" placeholder="有什么想法，直接告诉我…"></textarea>
          <div class="composer-toolbar">
            <div class="composer-tools"><button id="attach-button" class="icon-button" aria-label="上传文件" title="上传文件" type="button"><svg class="icon" aria-hidden="true"><use href="#i-paperclip"/></svg></button><input id="upload-files" type="file" multiple hidden accept=".pdf,.docx,.xlsx,.xlsm,.pptx,.txt,.md,.csv,.tsv,.sh,.html,.htm"><span id="context-label">未选择文件</span></div>
            <div class="send-tools"><button id="stop-button" class="stop-button hidden" type="button"><svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg>停止</button><button id="send-button" class="send-button" type="button" disabled aria-label="发送消息"><svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg></button></div>
          </div>
        </div>
        <p class="composer-hint"><span>Enter 发送<span class="hint-secondary"> · Shift + Enter 换行</span></span><span id="composer-model"></span></p>
      </div>
    </main>
  </div>
</body>
</html>
