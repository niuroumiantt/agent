<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="agent-session" content="__SESSION_TOKEN__">
  <meta name="color-scheme" content="dark">
  <title>Glocal Agent · 对话工作台</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="文件与对话">
      <header class="sidebar-header"><span class="brand-mark" aria-hidden="true">g</span><strong>Glocal Agent</strong><button id="close-sidebar" class="icon-button mobile-only" aria-label="关闭侧栏" type="button">×</button></header>
      <button id="new-chat" class="new-chat" type="button"><span aria-hidden="true">＋</span> 新对话 <kbd>⌘ K</kbd></button>
      <section class="sidebar-section files-section" aria-labelledby="files-heading">
        <div class="section-heading"><h2 id="files-heading">文件</h2><label class="select-all-label"><input id="select-all" type="checkbox"> 全选</label></div>
        <div class="file-list" id="file-list"><p class="sidebar-empty">正在读取文件…</p></div>
      </section>
      <section class="sidebar-section conversations-section" aria-labelledby="conversations-heading">
        <div class="section-heading"><h2 id="conversations-heading">对话</h2></div>
        <div id="conversation-list" class="conversation-list"></div>
      </section>
      <details class="legacy-tasks" id="legacy-tasks"><summary>此前的任务 <span id="job-count">0</span></summary><div id="job-list"></div></details>
      <footer class="sidebar-footer"><div class="model-status"><span id="model-dot" class="status-dot"></span><span id="model-name">正在读取模型…</span></div><nav id="office-apps" class="hidden" aria-label="公司应用"><a href="https://oa.glocalstorage.cn/">OA</a><a href="https://mail.glocalstorage.cn/">Mail</a><a href="/oauth2/sign_out">退出</a></nav></footer>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-label="关闭侧栏" type="button"></button>
    <main class="chat-workspace" id="chat-workspace">
      <header class="chat-header"><button id="open-sidebar" class="icon-button mobile-only" aria-label="打开文件与对话" aria-expanded="false" aria-controls="sidebar" type="button">☰</button><div class="chat-heading"><span class="header-label">个人工作空间</span><h1 id="chat-title">新对话</h1></div><span class="workspace-tag">对话工作台</span></header>
      <div class="thread" id="thread" tabindex="0" aria-label="对话内容"><section class="welcome" id="welcome"><span class="welcome-mark" aria-hidden="true">g</span><h2>想一起完成什么？</h2><p>左侧选择资料，直接告诉我你的想法。<br>我们在这里阅读、分析，然后继续讨论。</p><div class="suggestions"><button data-message="总结选中的文件，并引用原文。" type="button">总结这些材料 <span>↗</span></button><button data-message="比较选中的文件，指出差异和需要跟进的问题。" type="button">比较与核对 <span>↗</span></button><button data-message="查看文件列表" type="button">看看我的文件 <span>↗</span></button></div></section></div>
      <div class="composer-area"><div id="notice" class="notice hidden" role="status"></div><div class="composer" id="composer"><div id="attachments" class="attachments" aria-label="本条消息的文件"></div><label class="sr-only" for="message-input">发送给 Agent 的消息</label><textarea id="message-input" rows="2" maxlength="2000" placeholder="直接说你的想法，或拖入文件…"></textarea><div class="composer-toolbar"><div class="composer-tools"><button id="attach-button" class="icon-button" aria-label="上传文件" title="上传文件" type="button">＋</button><input id="upload-files" type="file" multiple hidden accept=".pdf,.docx,.xlsx,.xlsm,.pptx,.txt,.md,.csv,.tsv,.sh,.html,.htm"><span id="context-label">未选择文件</span></div><div class="send-tools"><button id="stop-button" class="stop-button hidden" type="button">■ 停止</button><button id="send-button" class="send-button" type="button" disabled aria-label="发送消息">↑</button></div></div></div><p class="composer-hint">Enter 发送 · Shift + Enter 换行 <span id="composer-model"></span></p></div>
    </main>
  </div>
</body>
</html>
